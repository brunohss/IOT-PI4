 events {}
 http {
         server {
            listen 80; # Porta do host para onde os requerimentos a serem redirecionados serão enviados
            server_name techsense; # Nome de domínio ou IP do host desse proxy

            location / {
                proxy_pass http://host.docker.internal:5173/; # Porta assinalada ao aplicativo do Front-end
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_cache_bypass $http_upgrade;
            }
        }
        server {
            listen 443; # Porta do host para onde os requerimentos a serem redirecionados serão enviados
            server_name techsense; # Nome de domínio ou IP do host desse proxy

            location / {
                proxy_pass http://host.docker.internal:5173/; # Porta assinalada ao aplicativo do Front-end
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_cache_bypass $http_upgrade;
            }
        }

    server {
        listen 8084;  # Porta do host para onde os requerimentos a serem redirecionados serão enviados
        server_name techsense; # Nome de domínio ou IP do host desse proxy

        location /api/v2/query {
            proxy_pass http://host.docker.internal:8086/api/v2/query; # Porta assinalada a base de dados InfluxDB v1.8.4

            # Interceptação de requerimento preflight dos navegadores, para circumvir CORS
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin '*';
                add_header Access-Control-Allow-Methods 'DELETE, GET, OPTIONS, POST, PUT';
                add_header Access-Control-Allow-Headers 'Accept, Accept-Encoding, Authorization, Content-Length, Content-Type, X-CSRF-Token, X-HTTP-Method-Override';
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
        }
    }
    
 }