version: "3.8"

services:
#Proxy reverso NGINX para lidar com redirecionamentos e CORS
  nginx:
    image: arm32v7/nginx:latest
    container_name: nginx
    ports:
     - "80:80"
     - "443:443"
     - "8084:8084"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend-bh
    extra_hosts:
          - "host.docker.internal:host-gateway"
#Front-end do projeto, encapsulado em um container node.js oficial, customizado no momento da composição
  frontend-bh:
    image: frontend-bh
    container_name: frontend-bh
    ports:
      - "5173:5173"
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - VITE_INFLUX_URL=http://techsense:8084
      - VITE_INFLUX_USER=frontend
      - VITE_INFLUX_PASSWORD=bhassist
      - VITE_INFLUX_BUCKET=iot/autogen
      - VITE_AUTH0_DOMAIN=dev-rqp1b0m06yswm43u.us.auth0.com
      - VITE_AUTH0_CLIENT_ID=xXZs9oM1kxJmH7fda7ojIfFbjbYdqTtO
      - VITE_AUTH0_REDIRECT_URI=http://localhost:5173
      - VITE_AUTH0_CLIENT_SECRET=eCImDTEmV9aluYN8llHpCXe037yrV9XTu98ew0Y6POnKJtsODRcWqlGKjLweM1u_
    depends_on:
      - influxdb
    extra_hosts:
          - "host.docker.internal:host-gateway"
#Container do InfluxDB 1.8.10 para compatibilidade com a imagem mais recente disponível para Arquitetura Armv7
  influxdb:
    image: arm32v7/influxdb:1.8.10
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=iot
      - INFLUXDB_ADMIN_USER=bhassist
      - INFLUXDB_ADMIN_PASSWORD=bhassist
      - INFLUXDB_HTTP_AUTH_ENABLED=true
      - INFLUXDB_HTTP_FLUX_ENABLED=true
      - INFLUXDB_WRITE_USER=mosquitto
      - INFLUXDB_WRITE_USER_PASSWORD=bhassist
      - INFLUXDB_READ_USER=frontend
      - INFLUXDB_READ_USER_PASSWORD=bhassist
    volumes:
      - ./init-influxdb.sh:/init-influxdb.sh:ro
      - influxdb-data:/var/lib/influxdb
      - ./influxdb-init.iql:/docker-entrypoint-initdb.d/init.iql:ro
    extra_hosts:
          - "host.docker.internal:host-gateway"
#Coordenador MQTT para coleta dos dados
  mosquitto:
    image: thinkboxas/core-mosquitto:v2-armv7
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    extra_hosts:
          - "host.docker.internal:host-gateway"
#Serviço de integração de APIs de entrada do InfluxDB
  telegraf:
    image: arm32v7/telegraf
    container_name: telegraf
    restart: unless-stopped
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - mosquitto
      - influxdb
    extra_hosts:
          - "host.docker.internal:host-gateway"
volumes:
  influxdb-data:
  mosquitto-data:
  mosquitto-log:
